services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: library_management
      MYSQL_USER: library_user
      MYSQL_PASSWORD_FILE: /run/secrets/app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    ports:
      - "127.0.0.1:3308:3306"
    secrets:
      - app_password
      - root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$(cat /run/secrets/app_password) mysql -h 127.0.0.1 -u library_user library_management -e 'SELECT 1 FROM books LIMIT 0' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  mysql_data:

secrets:
  app_password:
    file: ../../.venv/tv4_mysql/app_password
  root_password:
    file: ../../.venv/tv4_mysql/root_password